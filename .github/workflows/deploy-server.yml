name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error title=Missing key::The secret FIREBASE_SERVICE_ACCOUNT is not set in GitHub"
            exit 1
          fi
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          if ! node -e "const k=require(process.argv[1]);if(!k.client_email||!k.private_key)process.exit(1);console.log('key for',k.client_email)" "$RUNNER_TEMP/sa.json"; then
            echo "::error title=Bad key::FIREBASE_SERVICE_ACCOUNT is not a valid service-account JSON (paste the whole file)"
            exit 1
          fi

      - name: Give the server the game
        run: cp index.html functions/game.html

      - name: Find where the database lives
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          LOC=$(gcloud firestore databases describe --database='(default)' --project=mafia-18448 --format='value(locationId)' 2>/dev/null || true)
          case "$LOC" in
            nam5|nam7|"") REGION=us-central1 ;;
            eur3) REGION=europe-west1 ;;
            *) REGION="$LOC" ;;
          esac
          echo "{\"region\":\"$REGION\",\"database\":\"$LOC\"}" > functions/region.json
          echo "Database in '$LOC' -> server in $REGION"

      - name: Install server packages
        run: npm install --prefix functions --no-audit --no-fund

      - name: Deploy to Firebase
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          deploy() { npx -y firebase-tools@latest deploy --only functions,firestore:rules --project mafia-18448 --non-interactive --force > "$RUNNER_TEMP/deploy.log" 2>&1; }
          set +e
          deploy; code=$?
          if [ $code -ne 0 ]; then
            echo "First try failed (normal on the very first deploy) - waiting 90s and trying again"
            cat "$RUNNER_TEMP/deploy.log"
            sleep 90
            deploy; code=$?
          fi
          cat "$RUNNER_TEMP/deploy.log"
          if [ $code -ne 0 ]; then
            grep -iE "error|denied|permission|billing|enable|not found|failed" "$RUNNER_TEMP/deploy.log" | tail -n 8 | while IFS= read -r line; do
              echo "::error title=Deploy::${line:0:300}"
            done
            exit $code
          fi

name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error title=Missing key::The secret FIREBASE_SERVICE_ACCOUNT is not set in GitHub"
            exit 1
          fi
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          if ! node -e "const k=require(process.argv[1]);if(!k.client_email||!k.private_key)process.exit(1);console.log('key for',k.client_email)" "$RUNNER_TEMP/sa.json"; then
            echo "::error title=Bad key::FIREBASE_SERVICE_ACCOUNT is not a valid service-account JSON (paste the whole file)"
            exit 1
          fi

      - name: Install server packages
        run: npm install --prefix functions --no-audit --no-fund

      - name: Deploy to Firebase
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only functions --project mafia-18448 --non-interactive --force > "$RUNNER_TEMP/deploy.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/deploy.log"
          if [ $code -ne 0 ]; then
            # show the important lines on the run's summary page
            grep -iE "error|denied|permission|billing|enable|not found|failed" "$RUNNER_TEMP/deploy.log" | tail -n 8 | while IFS= read -r line; do
              echo "::error title=Deploy::${line:0:300}"
            done
            exit $code
          fi

<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --night:#15111b; --panel:#201a28; --panel2:#2a2233; --line:#3a3045;
  --brass:#c9a227; --blood:#9b1d30; --cream:#efe6d8; --muted:#a59cad; --ok:#4f9d69;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:20px 16px 60px}
#app.wide{max-width:1200px}
h1{font-family:var(--display);font-size:44px;font-weight:700;color:var(--brass);line-height:1.1}
h2{font-family:var(--display);font-size:26px;font-weight:700;margin-bottom:10px}
h3{font-size:18px;font-weight:700;margin:18px 0 8px;color:var(--brass)}
p.sub{color:var(--muted)}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--cream);
  font:700 18px var(--body);padding:15px 18px;border-radius:12px;cursor:pointer;margin-top:10px;text-align:center}
.btn.main{background:var(--blood);border-color:var(--blood)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#1b1408}
.btn.small{display:inline-block;width:auto;font-size:14px;padding:7px 12px;margin:0}
.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--cream);font:700 20px var(--body);
  padding:14px;border-radius:12px;text-align:center;margin-top:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.warn{background:#3a2a10;border-color:var(--brass)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dead{opacity:.45;text-decoration:line-through}
.tag{font-size:13px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.mafia{background:#4a1520;color:#ffc9d0}.tag.people{background:#173226;color:#c6f0d3}.tag.neutral{background:#3a3115;color:#f3e2a6}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.code{font-family:var(--display);font-size:22px;color:var(--brass)}
.phase{font-family:var(--display);font-size:32px;text-align:center;margin:8px 0}
.news{font-size:20px;text-align:center;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.pick{border:1px solid var(--line);background:var(--panel2);color:var(--cream);font:700 17px var(--body);padding:16px 8px;border-radius:12px;cursor:pointer}
.pick.on{border-color:var(--brass);background:#3b3014}
.log{font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
.center{text-align:center}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--brass);color:#1b1408;
  font-weight:700;padding:10px 18px;border-radius:30px;display:none;z-index:9;max-width:90%}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-top:10px}
/* the role card */
.card{perspective:1200px;width:min(78vw,300px);aspect-ratio:560/865;margin:16px auto;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
  border:3px solid var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.back{background:repeating-linear-gradient(45deg,#2a1520 0 10px,#22101a 10px 20px)}
.back b{font-family:var(--display);font-size:40px;color:var(--brass)}
.front{background:var(--panel);transform:rotateY(180deg)}
.front .ic{font-size:72px;line-height:1}
.front .nm{font-family:var(--display);font-size:38px;color:var(--brass);margin:8px 0}
.front.pic{padding:0;border:0;overflow:hidden;border-radius:16px;background:#000}.front.pic img{width:100%;height:100%;object-fit:fill;display:block}
.card:not(.flip)+.extra{visibility:hidden}
.extra{text-align:center;color:var(--brass);font-weight:700;margin-top:-4px}
.thumb{width:100%;max-width:180px;display:block;margin:10px auto 0;border-radius:10px}
.front small{color:var(--muted);font-size:15px}
/* TV */
.tv h1{font-size:72px}.tv .phase{font-size:64px}.tv .news{font-size:34px}
.tv .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tv .pick{font-size:24px;cursor:default}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.card .in{transition:none}}

.tag.town{background:#16283f;color:#cfe3ff}
.cardimg{width:min(58vw,220px);display:block;margin:0 auto 12px;border-radius:14px}

.player-tile{display:flex;flex-direction:column;align-items:center;width:100%;border:1px solid var(--line);border-radius:14px;background:#080808;color:var(--cream);padding:8px;gap:7px;font:700 18px var(--body);text-align:center;overflow:hidden}
button.player-tile{cursor:pointer}.player-tile.on{border:2px solid var(--brass);box-shadow:0 0 0 2px #c9a22744}
.player-portrait{width:100%;max-width:220px;aspect-ratio:1;perspective:900px}
.status-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(0deg)}
.player-tile.fallen .status-flip{transform:rotateY(180deg)}
.status-front,.status-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.status-back{transform:rotateY(180deg)}
.status-flip img{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px}
.player-name{overflow-wrap:anywhere;line-height:1.35}.player-state{font-size:13px;color:var(--muted)}
.player-tile.fallen .player-state{color:#ff9d9d}
.player-tile.falling .status-flip{animation:playerDeathFlip .75s ease both}
@keyframes playerDeathFlip{from{transform:rotateY(0deg)}to{transform:rotateY(180deg)}}
.player-slot{min-width:0;text-align:center}.player-slot>.tag{display:inline-block;margin-top:6px}
@media(max-width:450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-tile{font-size:17px}}
@media(prefers-reduced-motion:reduce){.player-tile.falling .status-flip{animation:none}}

/* Atmospheric artwork, with opaque controls for readable play. */
body{background:#100d12;--scene-image:none;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(180deg,rgba(9,8,13,.32),rgba(9,8,13,.76) 60%,rgba(9,8,13,.94)),var(--scene-image);background-size:cover;background-position:center;background-repeat:no-repeat}
#app{position:relative}
.box{background:rgba(25,20,31,.94);border-color:#6f573946;box-shadow:0 12px 32px #0003}
.btn{background:#2b2232;box-shadow:0 5px 16px #0003}.btn.main{background:linear-gradient(135deg,#9b1d30,#631724);border-color:#b54650}
.btn.gold{background:linear-gradient(135deg,#e0bb54,#ac8128);border-color:#e0bb54}
.box.warn{background:rgba(58,42,16,.96);border-color:var(--brass)}
.btn:hover{filter:brightness(1.09)}.pick{background:#261e2c}.pick.on{background:#493917}
.welcome-art,.stage-art{position:relative;overflow:hidden;border:1px solid #b58c455c;border-radius:20px;background-image:linear-gradient(180deg,#09070b08,#09070bba),var(--scene-image);background-size:cover;background-position:center;box-shadow:0 14px 40px #0005}
.welcome-art{min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:26px 20px;margin-top:10px}
.welcome-art h1{font-size:72px;color:#edcf81;text-shadow:0 3px 20px #000;letter-spacing:2px}
.welcome-art .sub{color:#f0e6d8;text-shadow:0 2px 7px #000;max-width:370px;margin-top:10px}
.scene-eyebrow{display:inline-block;padding:3px 12px;border:1px solid #d1a65d66;border-radius:30px;font-size:13px;color:#edcf81;background:#160f15b3;margin-bottom:10px}
.stage-art{min-height:120px;display:flex;align-items:flex-end;justify-content:space-between;padding:16px 20px;margin-bottom:18px;gap:12px}
.stage-caption{font-family:var(--display);font-size:27px;color:#f6e8c7;text-shadow:0 2px 12px #000}
.stage-round{color:#edcf81;background:#100a13cf;border-radius:20px;padding:3px 12px;font-size:14px;white-space:nowrap}
body[data-scene="night"] .stage-art{background-position:center 44%}
body[data-scene="day"] .stage-art{background-position:center 65%}
body[data-mode="tv"] .stage-art{min-height:185px;padding:24px 30px}
body[data-mode="tv"] .stage-caption{font-size:42px}
body[data-mode="tv"] .stage-round{font-size:22px}
@media(max-width:450px){.welcome-art{min-height:255px}.welcome-art h1{font-size:58px}.stage-art{min-height:100px;padding:14px}.stage-caption{font-size:23px}}
@media(prefers-reduced-motion:reduce){.btn:hover{filter:none}}
.cd{font-variant-numeric:tabular-nums}

.player-portrait{display:block;width:100%;aspect-ratio:666/744;container-type:inline-size;max-width:240px}
.status-flip,.status-front,.status-back{display:block}
.plate-name{position:absolute;left:17.5%;width:49%;top:70.5%;height:15%;display:flex;align-items:center;justify-content:center;
  color:#1b1b1b;font:800 16px var(--display);font-size:clamp(11px,10cqw,30px);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.player-tile .player-name{visibility:hidden;height:0;line-height:0}
.player-tile.fallen .player-name{visibility:visible;height:auto;line-height:1.35;text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#e04545;color:#f0e6d8;font-size:20px}
.tv .player-tile.fallen .player-name{font-size:24px}
.player-tile{background:transparent;border-color:transparent}
.player-tile.fallen .player-state{color:#ff9d9d}

.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.home-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:128px;padding:18px 10px;
  border:1px solid #6f573966;border-radius:18px;background:rgba(32,26,40,.92);color:#edcf81;font:700 18px var(--body);cursor:pointer;box-shadow:0 10px 26px #0004;transition:transform .15s,filter .15s}
.home-btn span{color:var(--cream)}
.home-btn.primary{background:linear-gradient(145deg,#9b1d30,#5e1522);border-color:#b54650;color:#fff}
.home-btn:active{transform:scale(.97)}.home-btn:hover{filter:brightness(1.1)}
.home-btn:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.home-resume{display:flex;align-items:center;justify-content:center;gap:10px}
@media(prefers-reduced-motion:reduce){.home-btn{transition:none}}

/* ---------- friendlier UI ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;transition:transform .12s,filter .15s}
.btn.small{display:inline-flex;gap:6px;border-radius:10px}
.btn:active{transform:scale(.97)}
.btn .ic{flex:none;opacity:.95}
.with-ic{display:flex;align-items:center;gap:8px}
.with-ic .ic{color:var(--brass);flex:none}
.box{border-radius:18px}
.box>h3:first-child{padding-bottom:8px;border-bottom:1px solid #6f573933}
input{border-radius:14px;background:rgba(20,16,26,.9);transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--brass);box-shadow:0 0 0 4px #c9a2271f;outline:none}
#code{font-family:var(--display);font-size:34px;letter-spacing:12px}
.hero-ic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;margin:14px auto 14px;color:#edcf81;
  background:radial-gradient(circle at 32% 28%,#3e2c40,#17121d 70%);border:1px solid #c9a22766;box-shadow:0 0 0 7px #c9a2270d,0 12px 32px #0007}
.hero-ic.night{color:#bcd0ff;border-color:#7d97d966;box-shadow:0 0 0 7px #7d97d90f,0 12px 32px #0007}
.hero-ic.dead{color:#ff9d9d;border-color:#b5465066}
.hero-ic.gold{color:#1b1408;background:radial-gradient(circle at 32% 28%,#f2d47a,#a87c22 75%);border-color:#f2d47a}
.pick{text-align:center;border-radius:14px;transition:transform .12s,border-color .15s,background .15s;min-height:58px}
.pick:active{transform:scale(.96)}
.pick.on{box-shadow:0 0 0 3px #c9a22733}
.row b{font-variant-numeric:tabular-nums}
.tag{border:1px solid #ffffff10}
.dots{display:inline-flex;gap:3px;margin-inline-start:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--brass);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.top .btn.small{padding:8px 12px}
@media(prefers-reduced-motion:reduce){.btn,.pick{transition:none}.dots i{animation:none}}

/* ---------- scene art as full-page background ---------- */
body::before{background-image:linear-gradient(180deg,rgba(9,8,13,.05) 0%,rgba(9,8,13,.22) 50%,rgba(9,8,13,.55) 100%),var(--scene-image)!important;background-position:center 70%!important;filter:brightness(1.35) saturate(1.15)}
.welcome-art,.stage-art{background:none!important;border:0!important;box-shadow:none!important;border-radius:0}
.welcome-art{min-height:34vh;padding:20px 8px 6px}
.welcome-art h1{font-size:84px;text-shadow:0 4px 30px #000,0 0 2px #000}
.stage-art{min-height:auto;padding:6px 2px 0;margin-bottom:10px;align-items:center}
.stage-caption{font-size:30px;text-shadow:0 2px 16px #000,0 0 2px #000}
body[data-mode="tv"] .stage-caption{font-size:48px}
.box{background:rgba(20,16,26,.68)!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:#ffffff14!important}
.box.warn{background:rgba(58,42,16,.82)!important}
.home-btn{background:rgba(24,19,30,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:#ffffff1f}
.home-btn.primary{background:linear-gradient(145deg,rgba(155,29,48,.92),rgba(94,21,34,.92))}
.pick{background:rgba(38,30,44,.78)}
.top{text-shadow:0 2px 8px #000}
@media(max-width:450px){.welcome-art{min-height:30vh}.welcome-art h1{font-size:70px}.stage-caption{font-size:26px}}
.stage-art + .top > .tag,.stage-art + .tv > .top > .tag{display:none}
.site-logo{width:150px;height:150px;border-radius:50%;object-fit:cover;margin-bottom:14px;border:3px solid #c9a227;box-shadow:0 0 0 6px #c9a2271a,0 16px 40px #000b}
@media(max-width:450px){.site-logo{width:124px;height:124px}}
body[data-mode="tv"] .stage-round.cd{font-family:var(--display);font-size:72px;line-height:1;padding:14px 34px;border-radius:999px;
  border:3px solid #c9a227;background:rgba(16,10,19,.85);color:#f6e8c7;box-shadow:0 0 0 8px #c9a2271a,0 14px 40px #000a;font-variant-numeric:tabular-nums}
body[data-mode="tv"] .stage-round.cd.urgent{border-color:#e04545;color:#ffd0d0;box-shadow:0 0 0 8px #e045452b,0 14px 40px #000a;animation:tvPulse 1s ease-in-out infinite}
@keyframes tvPulse{50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){body[data-mode="tv"] .stage-round.cd.urgent{animation:none}}
/* big countdown on every screen */
.stage-art>span:last-child{align-items:center}
.stage-art{flex-wrap:wrap}
.stage-round.cd{font-family:var(--display);font-size:46px;line-height:1;padding:10px 26px;border-radius:999px;border:3px solid #c9a227;
  background:rgba(16,10,19,.85);color:#f6e8c7;box-shadow:0 0 0 6px #c9a2271a,0 12px 32px #000a;font-variant-numeric:tabular-nums}
.stage-round.cd.urgent{border-color:#e04545;color:#ffd0d0;box-shadow:0 0 0 6px #e045452b,0 12px 32px #000a;animation:tvPulse 1s ease-in-out infinite}
body[data-mode="host"] .stage-round.cd{font-size:60px;padding:12px 30px}
@media(max-width:600px){.stage-art>span:last-child{width:100%;justify-content:center!important;order:3;margin-top:8px}.stage-round.cd{font-size:44px}}
@media(prefers-reduced-motion:reduce){.stage-round.cd.urgent{animation:none}}
/* TV: timer front and centre, scales with the screen */
body[data-mode="tv"] .stage-art{justify-content:center;text-align:center}
body[data-mode="tv"] .stage-art>span:last-child{width:100%;justify-content:center!important;order:3;margin-top:14px;gap:16px!important}
body[data-mode="tv"] .stage-round.cd{font-size:clamp(80px,8vw,170px);padding:.12em .45em;border-width:4px}
body[data-mode="tv"] .stage-round:not(.cd){font-size:clamp(20px,1.6vw,34px);padding:6px 18px}
body[data-mode="tv"] .stage-caption{font-size:clamp(40px,3.4vw,72px)}
body[data-mode="tv"] #app.wide{max-width:min(92vw,1700px)}
body[data-mode="tv"] .player-state{font-size:clamp(14px,1vw,20px)}
body[data-mode="tv"] .tv .grid{grid-template-columns:repeat(auto-fill,minmax(clamp(110px,8.6vw,180px),1fr));gap:clamp(8px,1vw,18px)}
body[data-mode="tv"] .tv .news{margin:6px 0}
body[data-mode="tv"] .tv .box.news{padding:12px 18px;font-size:clamp(24px,2vw,40px)}
.winners{text-align:center;border-color:#c9a22766!important}
.winners h3{justify-content:center;border-bottom:0!important}
.win-names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.win-chip{background:linear-gradient(145deg,#f2d47a,#a87c22);color:#1b1408;font-weight:800;border-radius:999px;padding:8px 18px;font-size:18px;box-shadow:0 6px 18px #0006}
body[data-mode="tv"] .win-chip{font-size:clamp(22px,2vw,40px);padding:.3em .9em}
body[data-mode="tv"] .winners h3{font-size:clamp(24px,2vw,40px)}
/* points towers */
.towers{display:flex;align-items:stretch;gap:10px;height:270px;padding:10px 4px 0;overflow-x:auto}
.tower{flex:1 0 46px;max-width:110px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:46px}
.tw-pts{font:800 18px var(--display);color:#f6e8c7;margin-bottom:6px;font-variant-numeric:tabular-nums}
.tw-bar{position:relative;width:72%;border-radius:10px 10px 3px 3px;transform-origin:bottom;animation:twGrow .9s cubic-bezier(.2,.8,.2,1) both;
  background:repeating-linear-gradient(180deg,transparent 0 14px,#0000002e 14px 16px),linear-gradient(180deg,#8a7a8f,#3b3242);box-shadow:inset 0 0 0 1px #ffffff1a,0 8px 20px #0006}
.tw-bar::before{content:"";position:absolute;inset:6px 22% 6px 22%;background:repeating-linear-gradient(180deg,#f2d47a55 0 4px,transparent 4px 14px);border-radius:2px}
.tower.first .tw-bar{background:repeating-linear-gradient(180deg,transparent 0 14px,#00000026 14px 16px),linear-gradient(180deg,#f2d47a,#a87c22)}
.tower.first .tw-bar::before{background:repeating-linear-gradient(180deg,#fff8 0 4px,transparent 4px 14px)}
.tw-medal{font-style:normal;font-size:22px;line-height:1;margin-bottom:2px}
.tw-name{margin-top:8px;font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--cream)}
@keyframes twGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.over-cols{display:grid;grid-template-columns:1fr;gap:16px}
body[data-mode="tv"] .over-cols{grid-template-columns:2fr 1fr;align-items:start}
body[data-mode="tv"] .towers{height:clamp(200px,30vh,400px);gap:clamp(8px,1vw,18px)}
body[data-mode="tv"] .tw-pts{font-size:clamp(20px,1.8vw,34px)}
body[data-mode="tv"] .tw-name{font-size:clamp(14px,1.2vw,24px)}
body[data-mode="tv"] .tw-medal{font-size:clamp(22px,1.8vw,38px)}
body[data-mode="tv"] .tv .phase{margin:4px 0;font-size:clamp(34px,3vw,60px)}
@media(prefers-reduced-motion:reduce){.tw-bar{animation:none}}

function defaultDist(n){
  if(n<4)return KEYS.map(()=>0);
  const I=k=>KEYS.indexOf(k);
  const t=TABLE[n]?[...TABLE[n]]:(()=>{const x=[...TABLE[20]];x[0]=Math.floor(n/4);return x;})();
  const d=KEYS.map(k=>t[TABLE_KEYS.indexOf(k)]);
  d[I('godfather')]=0;
  if(d[I('mafia')]>=2){d[I('mafia')]--;d[I('godfather')]=1;}
  if(n>=12){ // big groups: neutrals (sniper + police) capped at floor(n/5)
    const cap=Math.floor(n/5),neutral=()=>d[I('suicidal')]+d[I('police')];
    for(const k of ['police','suicidal'])while(neutral()>cap&&d[I(k)]>0)d[I(k)]--;
  }
  d[I('citizen')]=0;d[I('citizen')]=n-d.reduce((a,b)=>a+b,0);
  return d;
}

/* TV: size the player tiles so everyone fits, using as many rows as needed */
function fitTVGrid(){
  if(S.mode!=='tv')return;
  const g=document.querySelector('.tv .grid');if(!g)return;
  const n=g.children.length;if(!n)return;
  for(let pass=0;pass<3;pass++){
  let extra=16,padX=0;
  [...g.children].forEach(t=>{const pp=t.querySelector('.player-portrait');if(!pp)return;const a=t.getBoundingClientRect(),b=pp.getBoundingClientRect();
    let k=16;[...t.children].forEach(c=>{if(c!==pp)k+=c.getBoundingClientRect().height;});extra=Math.max(extra,k+6);padX=Math.max(padX,a.width-b.width);});
  const top=g.getBoundingClientRect().top,W=g.clientWidth||innerWidth,H=Math.max(160,innerHeight-top-80);
  const gap=n>24?6:10,ratio=744/666,maxW=n<=10?230:200;
  let best=0,cols=n;
  for(let c=1;c<=n;c++){
    const rows=Math.ceil(n/c);
    const colW=(W-gap*(c-1))/c;
    const byH=((H-gap*(rows-1))/rows-extra)/ratio+padX;
    const w=Math.min(colW,byH,maxW);
    if(w>best+0.5){best=w;cols=c;}
  }
  g.style.setProperty('grid-template-columns',`repeat(${cols},${Math.max(50,Math.floor(best))}px)`,'important');
  g.style.setProperty('justify-content','center','important');g.style.setProperty('align-content','start','important');g.style.setProperty('gap',gap+'px','important');
  }
}

function vJoin(){return `<div class="top"><button class="btn small" data-a="home">رجوع</button></div>

  <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(params.get('room')||'')}">
  <button class="btn main" data-a="join">كمّل</button>`;}
function vName(){return `<div class="top"><button class="btn small" data-a="home">رجوع</button><span class="code">${esc(S.code)}</span></div>
  <div class="hero-ic">${ico('user',42)}</div><h2 class="center">شنو اسمك؟</h2><p class="sub center">هذا الاسم بيطلع للكل على التلفزيون. يكفي اسمك الأول أو لقب.</p><input id="name" maxlength="16" placeholder="اسمك أو لقبك" autocomplete="nickname"><p class="consent">بالدخول توافق على <a href="terms.html">شروط الاستخدام</a> و<a href="privacy.html">سياسة الخصوصية</a>. إذا عمرك أقل من 13 سنة، العب بإشراف ولي أمرك.</p><button class="btn main" data-a="name">ادخل</button>`;}
function vRules(){return `<div class="top"><button class="btn small" data-a="home">رجوع</button></div><h2>الشخصيات</h2>
  ${KEYS.map(k=>`<div class="box"><b style="font-size:20px">${ROLES[k].icon} ${ROLES[k].name}</b> <span class="tag ${ROLES[k].team}">${TEAM[ROLES[k].team]}</span>
  <p>${ROLES[k].ability}</p>${ROLE_IMG[k]?`<img class="thumb" src="${ROLE_IMG[k]}" alt="${ROLES[k].name}" loading="lazy">`:''}</div>`).join('')}
  <div class="box"><b>الفوز</b><p>الشرطي: نقطتان عن كل مافيا يقتلها. الانتحاري: 3 نقاط عند الموت في الجولة الأولى، ونقطة في الثانية.</p><p>حماية الدكتور تشمل جميع مصادر الإقصاء وتستمر حتى بدء الليل التالي. تمنع أول محاولة فقط، والمحاولة التالية تُقصي اللاعب.</p><p>الشعب (الدكتور والصحفي والحارس والمواطن) يفوز إذا طلع فريق المافيا كله، بما فيه الزعيم.</p><p>فريق المافيا (المافيا والزعيم) يفوز إذا صار عدد أفراده الأحياء يساوي أو أكثر من جميع الباقين. المحايدون لا يُحسبون ضمن الشعب ولا ينالون نقاط فوزه.</p></div>`;}

function rolePanel(){
  const sec=mySec(); if(!sec) return '';
  if(!S.revealed&&S.room.status==='day0'&&revealCE()&&srvNow()<revealCE()) return `<div class="reveal-cd" data-ce="${revealCE()}">${cdNum()}</div><p class="center sub">استعدوا… الكل بيكشف مع بعض</p>`;
  if(!S.revealed) return S.room.status==='day0'?`<button class="btn gold" data-a="reveal">اكشف شخصيتك</button>`:`<button class="reveal-mini" data-a="reveal" aria-label="اكشف شخصيتك">${ico('eye',22)}<span>شخصيتي</span></button>`;
  const R=ROLES[sec.role]; let extra='';
  if(isMafiaRole(sec.role)) extra=sec.teammates.length?`زملاؤك: ${sec.teammates.map(t=>esc(t.name)).join('، ')}`:'انت المافيا الوحيد';
  if(sec.role==='police')extra=`الطلقات المتبقية: ${sec.bullets??2}`;
  if(sec.role==='journalist'&&sec.checks?.length) extra='نتائج فحصك:<br>'+sec.checks.map(c=>`${esc(c.name)}: ${c.isMafia?'مافيا 🔴':'مو مافيا 🟢'}`).join('<br>');
  return `<div class="box center">${ROLE_IMG[sec.role]?`<img class="cardimg" src="${ROLE_IMG[sec.role]}" alt="كرت ${R.name}: ${R.ability}">`:''}
    ${ROLE_IMG[sec.role]?'':`<h2>${R.icon} ${R.name}</h2><p>${R.ability}</p>`}${extra?`<p class="extra" style="margin-top:8px">${extra}</p>`:''}
    <button class="btn" data-a="hide">إخفاء الشخصية</button></div>`;
}
function playerTile(p,action=null,selected=false){
  const dead=p.alive===false,tag=action?'button':'div';
  if(S.mode!=='tv')return `<${tag} class="pick ${dead?'dead':''} ${selected?'on':''}" ${action?`type="button" data-a="${action}" data-v="${p.id}" aria-pressed="${selected}"`:''}>${dead?'💀 ':''}${esc(p.name)}</${tag}>`;

function playerBody(){

      const type=nightType(), mine=S.myAction&&S.myAction.round===r.round?S.myAction.target:null;
      if(!type){ if(m.alive) body+=`<div class="box center"><div class="hero-ic night">${ico('moon',40)}</div><h2>عينك على جوالك 📱</h2><p class="sub">خل عينك على شاشة جوالك لين يصبح الصبح، ولا تطالع أحد</p></div>`; }
      else{
        const done=type==='check'&&sec.checks?.find(c=>c.round===r.round);
        const mates=type==='kill'?sec.teammates.map(t=>t.id):[];
        const targets=alive.filter(p=>type==='protect'?true:(p.id!==UID&&!mates.includes(p.id)));
        const label={kill:'منو تقصون الليلة؟',protect:'منو تحمي الليلة؟',guard:'منو تحرس الليلة؟',check:'منو تفحص الليلة؟',shoot:'تطلق على منو؟'}[type];
        body+=`<h2 style="margin-top:16px">${label}</h2>`;
        if(type==='shoot')body+=`<p>الطلقات المتبقية: ${sec.bullets??2}</p><button class="btn" data-a="skipShot">احتفظ بالطلقة هذه الليلة</button>${S.myAction?.round===r.round&&S.myAction.target===null?'<p>✔ اخترت الاحتفاظ بالطلقة</p>':''}`;
        if(done) body+=`<div class="box center"><b style="font-size:22px">${esc(done.name)}: ${done.isMafia?'مافيا 🔴':'مو مافيا 🟢'}</b></div>`;
        else if(type==='check'&&mine) body+=`<div class="box center"><p class="sub">جاري الفحص…</p></div>`;
        else body+=`<div class="grid">${targets.map(p=>type==='guard'&&p.id===sec.lastGuarded?`<div class="pick locked" aria-disabled="true">🚫 ${esc(p.name)}<small>حرسته الليلة اللي فاتت</small></div>`:type==='protect'&&p.id===sec.lastProtected?`<div class="pick locked" aria-disabled="true">🚫 ${esc(p.name)}<small>حميته الليلة اللي فاتت</small></div>`:playerTile(p,'act',mine===p.id)).join('')}</div>`;
        if(type==='kill'){
          const agree=sec.mafiaAgreement?.round===r.round?sec.mafiaAgreement:null;

          const others=sec.teammates.filter(t=>voters.includes(t.id));

          if(sec.teammates.length){
            const alv=id=>alivePlayers().some(p=>p.id===id);
            body+=`<div class="box mates"><h3 style="margin-top:0">👥 زملاؤك ومين اختاروا</h3>${sec.teammates.map(t=>{

              return `<div class="row"><b>${esc(t.name)}</b>${st}</div>`;}).join('')}

          }
        }

      if(r.pendingRevenge?.[0]===UID){body+=`<div class="box warn"><h2>اختر شخصًا يموت معك</h2><div class="grid">${alive.map(p=>playerTile(p,'act',S.myAction?.target===p.id)).join('')}</div><p>بعد اختيارك تتنفّذ النتيجة تلقائيًا.</p></div>`;}
      else body+='<div class="box center">انتظر اختيار الانتحاري…</div>';
    }
    if(['morning','result'].includes(r.status)&&r.news) body+=`<div class="box news">${esc(r.news)}</div>`;
    if(r.status==='defense'){
      const acc=r.accused;
      body+=acc===UID?`<div class="box center"><div class="hero-ic dead">${ico('user',40)}</div><h2>🎤 دافع عن نفسك!</h2><p class="sub">عليك أكثر الأصوات… عندك وقت قصير تقنعهم إنك بريء</p></div>`
        :`<div class="box center"><div class="hero-ic">${ico('user',40)}</div><h2>🎤 ${esc(nameOf(acc))} يدافع عن نفسه</h2><p class="sub">اسمعوه… بعدها تصويت نهائي</p></div>`;
    }
    if(r.status==='vote'&&m.alive&&r.stage==='verdict'){
      const mv=S.votes[UID],acc=r.accused;
      body+=acc===UID?`<div class="box center"><h2>⚖️ الشعب يقرر مصيرك…</h2><p class="sub">انتظر النتيجة</p></div>`
        :`<h2 style="margin-top:16px">${esc(nameOf(acc))}: يطلع أو يبقى؟</h2><div class="verdict"><button class="btn noic ${mv===acc?'main':''}" data-a="vote" data-v="${acc}">👎 يطلع</button><button class="btn noic ${mv==='skip'?'gold':''}" data-a="vote" data-v="skip">✋ يبقى</button></div>${mv?'<p class="center sub" style="margin-top:12px">✔ وصل صوتك، تقدر تغيّره</p>':''}`;
    }
    if(r.status==='vote'&&m.alive&&r.stage!=='verdict'){
      const mv=S.votes[UID];
      body+=`<h2 style="margin-top:16px">صوّت على منو يطلع</h2>${r.revote?`<div class="box news" style="margin-bottom:10px">${esc(r.news)}</div>`:''}<div class="grid">${alive.filter(p=>p.id!==UID&&(!r.revote||(r.candidates||[]).includes(p.id))).map(p=>playerTile(p,'vote',mv===p.id)).join('')}</div>
      <button class="btn noic abstain ${mv==='skip'?'gold':''}" data-a="vote" data-v="skip" aria-pressed="${mv==='skip'}">${ico('x',20)} امتناع عن التصويت</button>
      ${mv?`<p class="center sub" style="margin-top:12px">✔ ${mv==='skip'?'امتنعت عن التصويت':'وصل صوتك'}، تقدر تغيّره</p>`:''}`;
    }
    if(r.status==='over'&&overStep()===1) body+=overSummary();
    else if(r.status==='over') body+=`<div class="box center"><div class="hero-ic gold">${ico('trophy',42)}</div><div class="phase">${winText(r.winner)}</div><p>نقاطك في هاللعبة: <b>${m.points||0}</b></p></div><div class="box"><h3 style="margin-top:0">النقاط</h3>${towers()}${whyBox()}</div>${totalsBox()}${winnersBox()}<div class="box">${revealList()}</div>${recapBox()}${historyBox()}<div class="center" style="margin-top:14px">${igLink()}</div>`;
  }
  return body;
}

function tvGridStyle(){
  const n=Math.max(1,S.players.length);

  const cols=Math.ceil(n/rows);
  const H=(window.innerHeight||1080)*(S.room?.status==='lobby'?0.46:0.46);
  const tile=Math.max(56,Math.min(180,Math.floor((H/rows-48)/1.12),Math.floor(((window.innerWidth||1920)*0.92)/cols-10)));
  return `--cols:${cols};max-width:${cols*(tile+10)}px;margin-inline:auto`;
}

    storeOk:()=>{ls.set('mafia_store_ok','1');render();}, overNext:()=>{S.overSeen=S.room?.gameNo||0;S.lastHtml=null;render();scrollTo(0,0);}, zoomCard:()=>{S.zoom=v;S.lastHtml=null;render();}, zoomClose:()=>{S.zoom=null;S.lastHtml=null;render();}, cancelLoad:()=>idle(), playerLeave:()=>playerLeave(), sound:()=>SFX.toggle(), narr:()=>NARR.toggle(), tutDone:()=>{ls.set('mafia_tut','1');render();}, transfer:()=>hostAction('transfer',v), shareRoom:()=>navigator.share&&navigator.share({title:'مافيا',text:'تعال العب مافيا معنا 🕵️',url:joinUrl(S.code)}).catch(()=>{}), kick:()=>hostAction('kick',v), h:()=>hostAction(v), timer:()=>H.timer(v).catch(onErr), joinSelf:()=>hostAction('joinSelf'), leaveSelf:()=>hostAction('leaveSelf')
  }[b.dataset.a]||(()=>{}))();
});
document.addEventListener('visibilitychange',()=>{
  const vis=document.visibilityState==='visible';
  if(S.mode==='host'&&S.room&&isHost()&&S.code)roomRef(S.code).update({hostAway:!vis,hostBeat:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
  if(vis){wakeLock=null;keepAwake();tick();}
});
document.addEventListener('keydown',e=>{const rb=e.target.closest&&e.target.closest('[role=button]');if(rb&&(e.key==='Enter'||e.key===' ')){e.preventDefault();rb.click();return;}if(e.key!=='Enter')return;if(document.getElementById('hostName')){hostAction('joinSelf');return;}if(document.getElementById('code'))document.querySelector('[data-a=join]').click();else if(document.getElementById('name'))document.querySelector('[data-a=name]').click();});
render();

</script>

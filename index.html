<style>
:root{
  --night:#15111b; --panel:#201a28; --panel2:#2a2233; --line:#3a3045;
  --brass:#c9a227; --blood:#9b1d30; --cream:#efe6d8; --muted:#a59cad; --ok:#4f9d69;
  --display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:20px 16px 60px}
#app.wide{max-width:1200px}
h1{font-family:var(--display);font-size:44px;font-weight:700;color:var(--brass);line-height:1.1}
h2{font-family:var(--display);font-size:26px;font-weight:700;margin-bottom:10px}
h3{font-size:18px;font-weight:700;margin:18px 0 8px;color:var(--brass)}
p.sub{color:var(--muted)}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--cream);
  font:700 18px var(--body);padding:15px 18px;border-radius:12px;cursor:pointer;margin-top:10px;text-align:center}
.btn.main{background:var(--blood);border-color:var(--blood)}
.btn.gold{background:var(--brass);border-color:var(--brass);color:#1b1408}
.btn.small{display:inline-block;width:auto;font-size:14px;padding:7px 12px;margin:0}
.btn:disabled{opacity:.4}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--cream);font:700 20px var(--body);
  padding:14px;border-radius:12px;text-align:center;margin-top:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.warn{background:#3a2a10;border-color:var(--brass)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dead{opacity:.45;text-decoration:line-through}
.tag{font-size:13px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.mafia{background:#4a1520;color:#ffc9d0}.tag.people{background:#173226;color:#c6f0d3}.tag.neutral{background:#3a3115;color:#f3e2a6}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
.code{font-family:var(--display);font-size:22px;color:var(--brass)}
.phase{font-family:var(--display);font-size:32px;text-align:center;margin:8px 0}
.news{font-size:20px;text-align:center;white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.pick{border:1px solid var(--line);background:var(--panel2);color:var(--cream);font:700 17px var(--body);padding:16px 8px;border-radius:12px;cursor:pointer}
.pick.on{border-color:var(--brass);background:#3b3014}
.log{font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
.center{text-align:center}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--brass);color:#1b1408;
  font-weight:700;padding:10px 18px;border-radius:30px;display:none;z-index:9;max-width:90%}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-top:10px}
/* the role card */
.card{perspective:1200px;width:min(78vw,300px);aspect-ratio:560/865;margin:16px auto;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
  border:3px solid var(--brass);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.back{background:repeating-linear-gradient(45deg,#2a1520 0 10px,#22101a 10px 20px)}
.back b{font-family:var(--display);font-size:40px;color:var(--brass)}
.front{background:var(--panel);transform:rotateY(180deg)}
.front .ic{font-size:72px;line-height:1}
.front .nm{font-family:var(--display);font-size:38px;color:var(--brass);margin:8px 0}
.front.pic{padding:0;border:0;overflow:hidden;border-radius:16px;background:#000}.front.pic img{width:100%;height:100%;object-fit:fill;display:block}
.card:not(.flip)+.extra{visibility:hidden}
.extra{text-align:center;color:var(--brass);font-weight:700;margin-top:-4px}
.thumb{width:100%;max-width:180px;display:block;margin:10px auto 0;border-radius:10px}
.front small{color:var(--muted);font-size:15px}
/* TV */
.tv h1{font-size:72px}.tv .phase{font-size:64px}.tv .news{font-size:34px}
.tv .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tv .pick{font-size:24px;cursor:default}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.card .in{transition:none}}

.tag.town{background:#16283f;color:#cfe3ff}
.cardimg{width:min(58vw,220px);display:block;margin:0 auto 12px;border-radius:14px}

.player-tile{display:flex;flex-direction:column;align-items:center;width:100%;border:1px solid var(--line);border-radius:14px;background:#080808;color:var(--cream);padding:8px;gap:7px;font:700 18px var(--body);text-align:center;overflow:hidden}
button.player-tile{cursor:pointer}.player-tile.on{border:2px solid var(--brass);box-shadow:0 0 0 2px #c9a22744}
.player-portrait{width:100%;max-width:220px;aspect-ratio:1;perspective:900px}
.status-flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateY(0deg)}
.player-tile.fallen .status-flip{transform:rotateY(180deg)}
.status-front,.status-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.status-back{transform:rotateY(180deg)}
.status-flip img{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px}
.player-name{overflow-wrap:anywhere;line-height:1.35}.player-state{font-size:13px;color:var(--muted)}
.player-tile.fallen .player-state{color:#ff9d9d}
.player-tile.falling .status-flip{animation:playerDeathFlip .75s ease both}
@keyframes playerDeathFlip{from{transform:rotateY(0deg)}to{transform:rotateY(180deg)}}
.player-slot{min-width:0;text-align:center}.player-slot>.tag{display:inline-block;margin-top:6px}
@media(max-width:450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-tile{font-size:17px}}

/* Atmospheric artwork, with opaque controls for readable play. */

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(180deg,rgba(9,8,13,.32),rgba(9,8,13,.76) 60%,rgba(9,8,13,.94)),var(--scene-image);background-size:cover;background-position:center;background-repeat:no-repeat}
#app{position:relative}

.btn{background:#2b2232;box-shadow:0 5px 16px #0003}.btn.main{background:linear-gradient(135deg,#9b1d30,#631724);border-color:#b54650}
.btn.gold{background:linear-gradient(135deg,#e0bb54,#ac8128);border-color:#e0bb54}

.btn:hover{filter:brightness(1.09)}.pick{background:#261e2c}.pick.on{background:#493917}
.welcome-art,.stage-art{position:relative;overflow:hidden;border:1px solid #b58c455c;border-radius:20px;background-image:linear-gradient(180deg,#09070b08,#09070bba),var(--scene-image);background-size:cover;background-position:center;box-shadow:0 14px 40px #0005}

.welcome-art h1{font-size:72px;color:#edcf81;text-shadow:0 3px 20px #000;letter-spacing:2px}

.cd{font-variant-numeric:tabular-nums}

.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}

.champ{position:relative;overflow:hidden;text-align:center;border-radius:20px;padding:22px 14px;margin-bottom:14px;background:radial-gradient(circle at 50% 0,#c9a22755,transparent 70%),#1a1420;border:2px solid #c9a227}
.champ-crown{font-size:64px;line-height:1}.champ-title{color:#a59cad;font-weight:700}.champ-name{font-family:var(--display,inherit);font-size:44px;color:#f2d47a}.champ-pts{color:#e9dcc6}
.champ-rest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.champ-rest span{background:#ffffff10;border-radius:999px;padding:4px 10px;font-size:14px}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fall 3.2s linear infinite}@keyframes fall{to{transform:translateY(420px) rotate(360deg);opacity:0}}
body[data-mode="tv"] .champ-name{font-size:clamp(44px,5vw,96px)}
.drama{position:fixed;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;animation:drFade 5.6s linear both;pointer-events:none}
.dr-wait,.dr-news{position:absolute;text-align:center;color:#f6e8c7}
.dr-wait{font-size:clamp(60px,8vw,140px);animation:drWait 5.6s linear both}.dr-wait span{display:block;font-size:clamp(22px,2.4vw,46px);margin-top:12px;color:#a59cad}
.dr-news{font-family:var(--display,inherit);font-size:clamp(40px,5vw,96px);color:#ff9b9b;padding:0 5vw;animation:drNews 5.6s linear both}
@keyframes drFade{0%,82%{opacity:1}100%{opacity:0}}@keyframes drWait{0%{opacity:0}8%,40%{opacity:1;transform:scale(1)}46%,100%{opacity:0;transform:scale(1.2)}}@keyframes drNews{0%,46%{opacity:0;transform:scale(.7)}54%,100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.drama,.dr-wait,.dr-news{animation-duration:.01s}.confetti{display:none}}
.peek{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.peek-card{display:none}.peek.show .peek-card{display:block}.peek.show .peek-cover{display:none}
.peek-big .peek-cover{padding:40px 10px;border:2px dashed #c9a22788;border-radius:16px;font-size:44px}.peek-big .peek-cover b{display:block;font-size:20px;margin-top:10px}.peek-big .peek-cover small{display:block;color:#a59cad;font-size:13px}
.peek-mini{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30}
.peek-mini .peek-cover{display:flex;align-items:center;gap:6px;height:54px;padding:0 16px;border-radius:999px;border:1px solid #c9a22799;background:rgba(20,16,26,.92);color:#edcf81;font-weight:700;box-shadow:0 8px 22px #0008}.peek-mini .peek-cover small{font-weight:400;color:#a59cad;font-size:11px}
.peek-mini.show .peek-card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,4,10,.94);padding:20px;text-align:center}
.peek-mini.show .cardimg{width:min(78vw,320px)}
.av-big{font-size:64px;text-align:center;line-height:1.1;margin:6px 0}
.av-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:12px}.av-opt{font-size:22px;padding:6px 0;border-radius:10px;border:1px solid transparent;background:#ffffff08;cursor:pointer}.av-opt.on{border-color:#c9a227;background:#c9a22733}
.pk-av{margin-inline-end:6px}
.tile-av{position:absolute;top:2%;right:6%;font-size:clamp(16px,24cqw,40px);line-height:1;filter:drop-shadow(0 2px 3px #000a)}
.tl-block{position:relative;padding:6px 0 6px 0;border-inline-start:3px solid #ffffff22;padding-inline-start:14px;margin-inline-start:6px}
.tl-block.night{border-color:#5b6bd9}.tl-block.day{border-color:#c9a227}.tl-block.start{border-color:#888}
.tl-head{font-weight:800;margin-bottom:4px;color:#edcf81}.tl-item{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:15px}.tl-dot{width:24px;flex:none;text-align:center}
body[data-mode="tv"] .tl-item{font-size:clamp(15px,1.15vw,22px)}
.ov-tabs{position:sticky;top:0;z-index:12;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:0 -2px 10px;background:linear-gradient(#0d0a10ee,#0d0a10cc);scrollbar-width:none}
.ov-tabs::-webkit-scrollbar{display:none}
.ov-tab{flex:none;border:1px solid #c9a22755;background:#1a1420;color:#e9dcc6;border-radius:999px;padding:8px 14px;font:700 14px var(--body,inherit);cursor:pointer;white-space:nowrap}
.ov-tab.on{background:linear-gradient(145deg,#f2d47a,#b8892a);color:#1b1408;border-color:#f2d47a}
.over-host{display:grid;gap:8px;margin-top:14px}
body[data-mode="tv"] .ov-tabs{justify-content:center;background:none;position:static}body[data-mode="tv"] .ov-tab{font-size:clamp(14px,1.2vw,24px);padding:.5em 1.1em}
/* themes */
.theme-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.theme-deco i{position:absolute;font-style:normal;opacity:.13;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-18px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.theme-deco i{animation:none}}
#app{position:relative;z-index:1}
body[data-theme="ramadan"]::after,body[data-theme="camp"]::after,body[data-theme="escape"]::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}
body[data-theme="ramadan"]::after{background:radial-gradient(circle at 80% 10%,#7b5cff33,transparent 45%),linear-gradient(180deg,#0b3a4a55,#2a124a55)}
body[data-theme="camp"]::after{background:radial-gradient(circle at 50% 100%,#ff8a3d40,transparent 55%),linear-gradient(180deg,#3a210f44,#120a0566)}
body[data-theme="escape"]::after{background:radial-gradient(circle at 50% 0,#b0141433,transparent 55%),linear-gradient(180deg,#00000033,#1a000055)}
body[data-theme="ramadan"] .btn.main,body[data-theme="ramadan"] .ov-tab.on,body[data-theme="ramadan"] .tour-tag{background:linear-gradient(145deg,#9be7e0,#3aa59b)!important;border-color:#9be7e0!important;color:#06231f!important}
body[data-theme="camp"] .btn.main,body[data-theme="camp"] .ov-tab.on,body[data-theme="camp"] .tour-tag{background:linear-gradient(145deg,#ffb36b,#d9682b)!important;border-color:#ffb36b!important;color:#2a1205!important}
body[data-theme="escape"] .btn.main,body[data-theme="escape"] .ov-tab.on,body[data-theme="escape"] .tour-tag{background:linear-gradient(145deg,#ff6b6b,#a3121b)!important;border-color:#ff8f8f!important;color:#fff!important}
body[data-mode="player"] #app,body[data-mode="host"] #app{padding-bottom:96px}
#app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body[data-theme]::after{display:none!important}
.pts-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:12px;background:#ffffff08;margin-top:6px}
.pts-row.changed{outline:2px solid #c9a227}.pts-ctrl{display:flex;gap:6px;align-items:center}.pts-ctrl input{width:76px;margin:0;padding:6px;text-align:center}
.pts-actions{display:flex;gap:8px;margin-top:10px}.pts-actions .btn{flex:1}.pts-actions .btn[disabled]{opacity:.5}
.skip-talk{margin-top:12px;text-align:center}.skip-talk .btn{width:100%}.skip-talk small{display:block;color:#a59cad;margin-top:6px}
.skip-tv{font-size:clamp(18px,1.6vw,32px);color:#edcf81}
.pick.offline,.player-tile.offline{opacity:.45}
.player-tile.offline::after{content:"📵";position:absolute;top:2%;left:6%;font-size:clamp(14px,20cqw,34px)}
.pick.offline{opacity:1}.pick.offline::after{display:none}
.cd.urgent,.timer.urgent,.urgent .cd-num{color:#ff6b6b!important}
.urgent{animation:urgentPulse 1s ease-in-out infinite}
@keyframes urgentPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.react-bar{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}.react-btn{width:46px;height:46px;border-radius:50%;border:1px solid #c9a22744;background:#1d1622;font-size:24px;cursor:pointer}
.react-btn:active{transform:scale(.88)}
#react-layer{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.react-fly{position:absolute;bottom:-60px;display:flex;flex-direction:column;align-items:center;animation:reactUp 3.2s ease-out forwards}
.react-fly span{font-size:clamp(40px,4vw,80px)}.react-fly small{font-size:clamp(12px,1vw,20px);color:#efe3cc;background:#0008;border-radius:999px;padding:1px 8px}
@keyframes reactUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-15vh) scale(1.1)}100%{transform:translateY(-85vh) scale(1);opacity:0}}
@media(prefers-reduced-motion:reduce){.urgent{animation:none}.react-fly{animation-duration:1.5s}}
/* ---------- TV lite: smart-TV browsers are slow, keep only the essential motion ---------- */
body[data-mode="tv"] *:not(.drama):not(.dr-wait):not(.dr-news):not(.reveal-cd):not(.spin):not(.react-fly){animation:none!important;transition:none!important}
body[data-mode="tv"] *{box-shadow:none!important;text-shadow:none!important}
body[data-mode="tv"] .player-tile *,body[data-mode="tv"] .box,body[data-mode="tv"] .ov-tab{filter:none!important}
body[data-mode="tv"] #app.phase-in{animation:none!important}
body[data-mode="tv"] .confetti{display:none!important}
body[data-mode="tv"]::before{will-change:auto!important}

    const rows=Math.ceil(n/best.cols),cols=Math.ceil(n/rows),w=Math.max(54,Math.min(220,Math.floor(best.w)));
    g.style.gridTemplateColumns=`repeat(${cols},${w}px)`;g.style.justifyContent='center';g.style.gap=gap+'px';
  });
}

/* TV: size the player tiles so everyone fits, using as many rows as needed */
function fitTVGrid(){
  if(S.mode!=='tv')return;
  const g=document.querySelector('.tv .grid');if(!g)return;
  const n=g.children.length;if(!n)return;
  const fk=n+'|'+innerWidth+'|'+innerHeight+'|'+Math.round(g.getBoundingClientRect().top/8)+'|'+g.querySelectorAll('.fallen').length;
  if(S.fitKey===fk&&S.fitStyle){g.style.cssText=S.fitStyle;return;}
  for(let pass=0;pass<3;pass++){
  let extra=16,padX=0;
  [...g.children].forEach(t=>{const pp=t.querySelector('.player-portrait');if(!pp)return;const a=t.getBoundingClientRect(),b=pp.getBoundingClientRect();
    let k=16;[...t.children].forEach(c=>{if(c!==pp)k+=c.getBoundingClientRect().height;});extra=Math.max(extra,k+6);padX=Math.max(padX,a.width-b.width);});
  const top=g.getBoundingClientRect().top,W=g.clientWidth||innerWidth,H=Math.max(160,innerHeight-top-80);
  const gap=n>24?6:10,ratio=744/666,maxW=n<=10?230:200;
  let best=0,cols=n;
  for(let c=1;c<=n;c++){
    const rows=Math.ceil(n/c);
    const colW=(W-gap*(c-1))/c;
    const byH=((H-gap*(rows-1))/rows-extra)/ratio+padX;
    const w=Math.min(colW,byH,maxW);
    if(w>best+0.5){best=w;cols=c;}
  }
  g.style.setProperty('grid-template-columns',`repeat(${cols},${Math.max(50,Math.floor(best))}px)`,'important');
  g.style.setProperty('justify-content','center','important');g.style.setProperty('align-content','start','important');g.style.setProperty('gap',gap+'px','important');
  }
  S.fitKey=fk;S.fitStyle=g.style.cssText;
}

    v.gain.setValueAtTime(g,t0);v.gain.exponentialRampToValueAtTime(0.0001,t0+d);s.connect(fl);fl.connect(v);v.connect(master);s.start(t0);s.stop(t0+d);}
  const P={
    join(t){tone(660,t,.12,{type:'triangle',g:.18});tone(990,t+.09,.16,{type:'triangle',g:.18});},

/* ---------- end-of-game titles (pure: easy to test) ---------- */
function gameTitles(winner,aliveIds,why,voteHist,outs,booms){
  const T=[],nm=id=>nameOf(id),isM=id=>isMafiaRole(roleOf(id));
  const good={};voteHist.forEach(h=>Object.entries(h.v||{}).forEach(([v,t])=>{if(isM(v))return;const tgt=h.acc?(t===h.acc?h.acc:null):t;if(tgt&&tgt!=='skip'&&isM(tgt))good[v]=(good[v]||0)+1;}));
  const det=Object.entries(good).sort((a,b)=>b[1]-a[1])[0];
  if(det)T.push({icon:'🕵️',title:'المحقق',name:nm(det[0]),why:`صوّت على المافيا ${det[1]} ${det[1]===1?'مرة':'مرات'}`});
  const act=S.players.find(p=>isM(p.id)&&aliveIds.includes(p.id)&&!outs.some(o=>o.id===p.id));
  if(act)T.push({icon:'🎭',title:'الممثل',name:nm(act.id),why:'من المافيا وما انكشف لين النهاية'});
  const vic=outs.find(o=>!isM(o.id));
  if(vic)T.push({icon:'😢',title:'الضحية المظلومة',name:nm(vic.id),why:'بريء وطلّعوه بالتصويت'});
  Object.entries(why||{}).forEach(([id,l])=>{
    if(l.some(x=>x.t.includes('ضحّى')))T.push({icon:'💂',title:'البطل',name:nm(id),why:'ضحّى بنفسه عشان ينقذ غيره'});
    if(l.some(x=>x.t.includes('قتل من المافيا')))T.push({icon:'🔫',title:'العين الصقر',name:nm(id),why:'قتل واحد من المافيا'});});
  booms.forEach(b=>{if(b.by&&b.v.some(isM))T.push({icon:'💣',title:'آخر ضحكة',name:nm(b.by),why:'أخذ معه واحد من المافيا'});});
  return T.slice(0,5);
}

function tourney(){const t=S.room?.tourney;if(!t)return null;const h=(S.room.history||[]).filter(g=>g.game>t.start);return {len:t.len,done:h.length,games:h,cur:Math.min(t.len,h.length+(S.room.status!=='lobby'&&S.room.status!=='over'?1:0))};}
function tourneyTag(){const t=tourney();if(!t)return '';return `<span class="tour-tag">🏆 لعبة ${Math.max(1,t.cur)} من ${t.len}</span>`;}
function championBox(){const t=tourney();if(!t||t.done<t.len||S.room.status!=='over')return '';
  const tot={};t.games.slice(0,t.len).forEach(g=>g.players.forEach(p=>{tot[p.name]=(tot[p.name]||0)+(p.pts||0);}));
  const rows=Object.entries(tot).sort((a,b)=>b[1]-a[1]);if(!rows.length)return '';
  return `<div class="champ"><div class="confetti" aria-hidden="true">${'🎉✨🎊⭐'.repeat(6).split('').map((e,i)=>`<i style="left:${(i*37)%100}%;animation-delay:${(i%8)*.35}s">${e}</i>`).join('')}</div>
    <div class="champ-crown">👑</div><div class="champ-title">بطل الليلة</div><div class="champ-name">${esc(rows[0][0])}</div><div class="champ-pts">${rows[0][1]} نقطة في ${t.len} ألعاب</div>
    <div class="champ-rest">${rows.slice(1,4).map((r,i)=>`<span>${['🥈','🥉','🏅'][i]} ${esc(r[0])} (${r[1]})</span>`).join('')}</div></div>`;}

function dramaEl(){const r=S.room;if(!r||r.status!=='morning'||!S.dramaAt)return '';const el=Date.now()-S.dramaAt;if(el>5600)return '';

/* ---------- end of game: simple tabs ---------- */
function overTabs(){
  const r=S.room,t=[['result','🏆 النتيجة']];
  if((r.titles||[]).length)t.push(['titles','🏅 الألقاب']);
  t.push(['points','📊 النقاط']);
  if((r.history||[]).length)t.push(['totals','🏆 المجموع']);
  if((r.recap||[]).length)t.push(['events','📜 الأحداث']);
  if((r.history||[]).length>1)t.push(['history','📚 السابقة']);
  if(S.mode!=='tv'&&profile().games)t.push(['me','👤 سجلي']);
  return t;
}
function overView(){
  const r=S.room,tabs=overTabs(),g=r.gameNo||0;
  if(S.overTabGame!==g){S.overTabGame=g;S.overTab='result';S.overTabAt=Date.now();}
  if(!tabs.some(x=>x[0]===S.overTab))S.overTab='result';
  const tab=S.overTab;let body='';
  if(tab==='result')body=championBox()+overSummary();
  else if(tab==='titles')body=titlesBox();
  else if(tab==='points')body=`<div class="box"><h3 style="margin-top:0">نقاط هاللعبة</h3>${towers()}${whyBox()}</div>`;
  else if(tab==='totals')body=totalsBox()+winnersBox();
  else if(tab==='events')body=recapBox();
  else if(tab==='history')body=historyBox().replace('<details class="box history">','<details class="box history" open>');
  else if(tab==='me')body=profileCard();
  const host=S.mode==='host'&&isHost()?`<div class="over-host"><button class="btn gold noic" data-a="h" data-v="deal">🔁 نفس الربع، جولة ثانية</button><button class="btn noic" data-a="h" data-v="lobby">رجوع للانتظار</button></div>`:'';
  const share=S.mode!=='tv'?`<button class="btn noic os-share" data-a="shareResult">📸 شارك النتيجة</button>`:'';
  return `<div class="ov-tabs" role="tablist">${tabs.map(([k,l])=>`<button class="ov-tab ${k===tab?'on':''}" role="tab" aria-selected="${k===tab}" data-a="ovTab" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="ov-body">${body}</div>${share}${host}${S.mode==='player'?`<div class="center" style="margin-top:14px">${igLink()}</div>`:''}`;
}

function vJoin(){return `<div class="top"><button class="btn small" data-a="home">رجوع</button></div>
  <div class="hero-ic">${ico(S.joinTV?'tv':'plus',42)}</div><h2 class="center">${S.joinTV?'شاشة التلفزيون':'الانضمام'}</h2><p class="sub center">اكتب كود الغرفة المكوّن من 4 أرقام</p>
  <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(params.get('room')||'')}">
  <button class="btn main" data-a="join">كمّل</button>`;}
const AVATARS=["🦊", "🐺", "🦁", "🐯", "🐻", "🐼", "🐸", "🐵", "🦉", "🦅", "🐍", "🦂", "🐙", "🦈", "🐲", "🦄", "👻", "🤠", "🕵️", "🎩"];
function vName(){if(!S.avatar)S.avatar=AVATARS[rnd(AVATARS.length)];return `<div class="top"><button class="btn small" data-a="home">رجوع</button><span class="code">${esc(S.code)}</span></div>
  <div class="av-big">${S.avatar}</div><h2 class="center">شنو اسمك؟</h2><p class="sub center">هذا الاسم بيطلع للكل على التلفزيون. يكفي اسمك الأول أو لقب.</p><input id="name" maxlength="16" placeholder="اسمك أو لقبك" autocomplete="nickname"><p class="sub center" style="margin:10px 0 6px">اختار رمزك:</p><div class="av-grid">${AVATARS.map(a=>`<button type="button" class="av-opt ${a===S.avatar?'on':''}" data-a="pickAv" data-v="${a}" aria-label="${a}" aria-pressed="${a===S.avatar}">${a}</button>`).join('')}</div><p class="consent">بالدخول توافق على <a href="terms.html">شروط الاستخدام</a> و<a href="privacy.html">سياسة الخصوصية</a>. إذا عمرك أقل من 13 سنة، العب بإشراف ولي أمرك.</p><button class="btn main" data-a="name">ادخل</button>`;}
function vRules(){return `<div class="top"><button class="btn small" data-a="home">رجوع</button></div><h2>الشخصيات</h2>
  ${KEYS.map(k=>`<div class="box"><b style="font-size:20px">${ROLES[k].icon} ${ROLES[k].name}</b> <span class="tag ${ROLES[k].team}">${TEAM[ROLES[k].team]}</span>
  <p>${ROLES[k].ability}</p>${ROLE_IMG[k]?`<img class="thumb" src="${ROLE_IMG[k]}" alt="${ROLES[k].name}" loading="lazy">`:''}</div>`).join('')}
  <div class="box"><b>الفوز</b><p>الشرطي: نقطتان عن كل مافيا يقتلها. الانتحاري: 3 نقاط عند الموت في الجولة الأولى، ونقطة في الثانية.</p><p>حماية الدكتور تشمل جميع مصادر الإقصاء وتستمر حتى بدء الليل التالي. تمنع أول محاولة فقط، والمحاولة التالية تُقصي اللاعب.</p><p>الشعب (الدكتور والصحفي والحارس والمواطن) يفوز إذا طلع فريق المافيا كله، بما فيه الزعيم.</p><p>فريق المافيا (المافيا والزعيم) يفوز إذا صار عدد أفراده الأحياء يساوي أو أكثر من جميع الباقين. المحايدون لا يُحسبون ضمن الشعب ولا ينالون نقاط فوزه.</p></div>`;}

function rolePanel(){
  const sec=mySec(); if(!sec||S.room.status==='over') return '';
  if(S.room.status==='day0'&&revealCE()&&srvNow()<revealCE()) return `<div class="reveal-cd" data-ce="${revealCE()}">${cdNum()}</div><p class="center sub">استعدوا… الكل بيكشف مع بعض</p>`;
  const R=ROLES[sec.role]; let extra='';
  if(isMafiaRole(sec.role)) extra=(sec.teammates||[]).length?`زملاؤك: ${sec.teammates.map(t=>esc(t.name)).join('، ')}`:'انت المافيا الوحيد';
  if(sec.role==='police')extra=`الطلقات المتبقية: ${sec.bullets??2}`;
  if(sec.role==='journalist'&&sec.checks?.length) extra='نتائج فحصك:<br>'+sec.checks.map(c=>`${esc(c.name)}: ${c.isMafia?'مافيا 🔴':'مو مافيا 🟢'}`).join('<br>');
  const card=`${ROLE_IMG[sec.role]?`<img class="cardimg" src="${ROLE_IMG[sec.role]}" alt="كرت ${R.name}: ${R.ability}" draggable="false">`:`<h2>${R.icon} ${R.name}</h2><p>${R.ability}</p>`}${extra?`<p class="extra" style="margin-top:8px">${extra}</p>`:''}`;

function playerBody(){

  if(r.status==='lobby'){
    body=lobbyRolesBox()+`${ls.get('mafia_tut')?'':`<div class="box tut"><h3 style="margin-top:0">كيف تلعب؟ 🕵️</h3><ol><li>لما تبدأ اللعبة اضغط <b>«اكشف شخصيتك»</b> ولا تخلي أحد يشوف شاشتك.</li><li><b>بالليل</b> إذا عندك دور، اختار من جوالك. وإذا ما عندك، خل عينك على شاشة جوالك عشان محد يعرف مين عنده دور.</li><li><b>بالنهار</b> ناقشوا وصوّتوا على اللي تشكون فيه.</li><li>الشعب يفوز إذا طلّع المافيا كلهم، والمافيا تفوز إذا صار عددهم مثل الباقين.</li></ol><button class="btn gold noic" data-a="tutDone">فهمت ✔</button></div>`}<div class="box center"><div class="hero-ic">${ico('users',40)}</div><h2>أهلاً ${esc(m.name)} 👋</h2><p class="sub">انتظر المشرف يبدأ اللعبة<span class="dots"><i></i><i></i><i></i></span></p></div>
    <div class="grid">${S.players.map(p=>playerTile(p)).join('')}</div>`;
  } else {
    const sec=mySec(), alive=alivePlayers();

    if(!m.alive&&!['over','revenge'].includes(r.status)) body+=`<div class="box center"><div class="hero-ic dead">${ico('skull',40)}</div><h2>انت طالع</h2><p class="sub">تابع بس لا تتكلم</p></div>`;
    if(r.status==='day0') body+=`<p class="center sub" style="margin:10px 0">لا تخلي أحد يشوف جوالك</p>`;

    body+=reactBar();
    body+=skipTalkBox();
    body+=rolePanel();
    if(r.status!=='lobby'&&r.status!=='over')body+=inGameBox(r.status==='day0');
    if(r.status==='night'){
      const type=nightType(), mine=S.myAction&&S.myAction.round===r.round?S.myAction.target:null;
      if(!type){ if(m.alive) body+=`<div class="box center"><div class="hero-ic night">${ico('moon',40)}</div><h2>عينك على جوالك 📱</h2><p class="sub">خل عينك على شاشة جوالك لين يصبح الصبح، ولا تطالع أحد</p></div>`; }
      else{
        const done=type==='check'&&sec.checks?.find(c=>c.round===r.round);
        const mates=type==='kill'?sec.teammates.map(t=>t.id):[];
        const targets=alive.filter(p=>type==='protect'?true:(p.id!==UID&&!mates.includes(p.id)));
        const label={kill:'منو تقصون الليلة؟',protect:'منو تحمي الليلة؟',guard:'منو تحرس الليلة؟',check:'منو تفحص الليلة؟',shoot:'تطلق على منو؟'}[type];
        body+=`<h2 style="margin-top:16px">${label}</h2>`;
        if(type==='shoot')body+=`<p>الطلقات المتبقية: ${sec.bullets??2}</p><button class="btn" data-a="skipShot">احتفظ بالطلقة هذه الليلة</button>${S.myAction?.round===r.round&&S.myAction.target===null?'<p>✔ اخترت الاحتفاظ بالطلقة</p>':''}`;
        if(done) body+=`<div class="box center"><b style="font-size:22px">${esc(done.name)}: ${done.isMafia?'مافيا 🔴':'مو مافيا 🟢'}</b></div>`;
        else if(type==='check'&&mine) body+=`<div class="box center"><p class="sub">جاري الفحص…</p></div>`;
        else body+=`<div class="grid">${targets.map(p=>type==='guard'&&p.id===sec.lastGuarded?`<div class="pick locked" aria-disabled="true">🚫 ${esc(p.name)}<small>حرسته الليلة اللي فاتت</small></div>`:type==='protect'&&p.id===sec.lastProtected?`<div class="pick locked" aria-disabled="true">🚫 ${esc(p.name)}<small>حميته الليلة اللي فاتت</small></div>`:playerTile(p,'act',mine===p.id)).join('')}</div>`;
        if(type==='kill'){
          const agree=sec.mafiaAgreement?.round===r.round?sec.mafiaAgreement:null;

          if(sec.teammates.length){
            const alv=id=>alivePlayers().some(p=>p.id===id);
            body+=`<div class="box mates"><h3 style="margin-top:0">👥 زملاؤك ومين اختاروا</h3>${sec.teammates.map(t=>{
              const sp=false;
              const st=!alv(t.id)?'<span class="tag dead">💀 طالع</span>':sp?'<span class="tag">🕵️ جاسوس، ما يختار</span>':pk[t.id]?`<span class="tag gold">🎯 ${esc(nameOf(pk[t.id]))}</span>`:'<span class="tag">⏳ لسه ما اختار</span>';
              return `<div class="row"><b>${esc(t.name)}</b>${st}</div>`;}).join('')}
              <div class="row me-row"><b>انت</b>${mine?`<span class="tag gold">🎯 ${esc(nameOf(mine))}</span>`:'<span class="tag">⏳ ما اخترت</span>'}</div></div>`;
          }
        }
        if(mine&&!done&&type!=='check') body+=`<p class="center sub" style="margin-top:12px">✔ وصل اختيارك، تقدر تغيّره قبل الصبح</p>`;
      }
    }
    if(r.status==='revenge'){
      if(r.pendingRevenge?.[0]===UID){body+=`<div class="box warn"><h2>اختر شخصًا يموت معك</h2><div class="grid">${alive.map(p=>playerTile(p,'act',S.myAction?.target===p.id)).join('')}</div><p>بعد اختيارك تتنفّذ النتيجة تلقائيًا.</p></div>`;}
      else body+='<div class="box center">انتظر اختيار الانتحاري…</div>';
    }
    if(['morning','result'].includes(r.status)&&r.news) body+=`<div class="box news">${esc(r.news)}</div>`;
    if(r.status==='defense'){
      const acc=r.accused;
      body+=acc===UID?`<div class="box center"><div class="hero-ic dead">${ico('user',40)}</div><h2>🎤 دافع عن نفسك!</h2><p class="sub">عليك أكثر الأصوات… عندك وقت قصير تقنعهم إنك بريء</p></div>`
        :`<div class="box center"><div class="hero-ic">${ico('user',40)}</div><h2>🎤 ${esc(nameOf(acc))} يدافع عن نفسه</h2><p class="sub">اسمعوه… بعدها تصويت نهائي</p></div>`;
    }
    if(r.status==='vote'&&m.alive&&r.stage==='verdict'){
      const mv=S.votes[UID],acc=r.accused;
      body+=acc===UID?`<div class="box center"><h2>⚖️ الشعب يقرر مصيرك…</h2><p class="sub">انتظر النتيجة</p></div>`
        :`<h2 style="margin-top:16px">${esc(nameOf(acc))}: يطلع أو يبقى؟</h2><div class="verdict"><button class="btn noic ${mv===acc?'main':''}" data-a="vote" data-v="${acc}">👎 يطلع</button><button class="btn noic ${mv==='skip'?'gold':''}" data-a="vote" data-v="skip">✋ يبقى</button></div>${mv?'<p class="center sub" style="margin-top:12px">✔ وصل صوتك، تقدر تغيّره</p>':''}`;
    }
    if(r.status==='vote'&&m.alive&&r.stage!=='verdict'){
      const mv=S.votes[UID];
      body+=`<h2 style="margin-top:16px">صوّت على منو يطلع</h2>${r.revote?`<div class="box news" style="margin-bottom:10px">${esc(r.news)}</div>`:''}<div class="grid">${alive.filter(p=>p.id!==UID&&(!r.revote||(r.candidates||[]).includes(p.id))).map(p=>playerTile(p,'vote',mv===p.id)).join('')}</div>
      <button class="btn noic abstain ${mv==='skip'?'gold':''}" data-a="vote" data-v="skip" aria-pressed="${mv==='skip'}">${ico('x',20)} امتناع عن التصويت</button>
      ${mv?`<p class="center sub" style="margin-top:12px">✔ ${mv==='skip'?'امتنعت عن التصويت':'وصل صوتك'}، تقدر تغيّره</p>`:''}`;
    }
    if(r.status==='over') body+=overView();
  }
  return body;
}

}

}

  if(S.screen==='room'&&S.room)html+=`<button class="sound-btn" data-a="sound" aria-label="${SFX.on()?'إيقاف الصوت':'تشغيل الصوت'}">${SFX.on()?'🔊':'🔇'}</button>`;
  if(S.screen==='room'&&hostLag())html+='<div class="host-lag" role="status">⏳ جهاز المشرف مو متصل…</div>';
  if(TEST_MODE)html+='<div class="test-badge">🧪 وضع التجربة: كل تبويب لاعب</div>';
  if(html===S.lastHtml&&!newlyDead.size){updateCountdowns();return;}
  S.lastHtml=html;
  if(S.screen==='room')html=themeDeco()+html;
  html+=dramaEl();
  if(S.screen==='room'&&S.room?.status==='over')recordGame();
  if(S.screen==='room'&&S.room&&tourney()&&S.room.status!=='lobby')html+=`<div class="tour-fixed">${tourneyTag()}</div>`;
  if(S.zoom&&ROLE_IMG[S.zoom])html+=`<div class="zoom-ov" data-a="zoomClose" role="dialog" aria-label="${esc(ROLES[S.zoom]?.name||'')}"><img src="${ROLE_IMG[S.zoom]}" alt=""></div>`;
  if(S.loading){const slow=Date.now()-(S.loadingAt||0)>7900;html+=`<div class="load-ov" role="status" aria-live="polite"><div class="load-box"><div class="spin"></div><p>${esc(S.loading)}</p>${slow?`<p class="sub">الاتصال بطيء شوي…</p><button class="btn small noic" data-a="cancelLoad">إلغاء وحاول مرة ثانية</button>`:''}</div></div>`;}
  $app.innerHTML=html;newlyDead.clear();decorate();tidy();updTurnTalk();fitTVGrid();
  if(keep&&document.getElementById(keep)&&val!=null){const el=document.getElementById(keep);el.value=val;el.focus();}
  updateCountdowns();
  const q=document.getElementById('qr');
  if(q){const sz=S.mode==='tv'?260:180,k=joinUrl(S.code)+'|'+sz;S.qrCache=S.qrCache||{};
    if(S.qrCache[k])q.innerHTML=`<img src="${S.qrCache[k]}" width="${sz}" height="${sz}" alt="رمز QR للانضمام إلى الغرفة ${esc(S.code)}">`;
    else if(window.QRCode){new QRCode(q,{text:joinUrl(S.code),width:sz,height:sz});const c=q.querySelector('canvas');if(c)try{S.qrCache[k]=c.toDataURL();}catch(e){}}}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b||b.disabled) return; const v=b.dataset.v;
  ({create:createRoom,
    goJoin:()=>{S.joinTV=false;S.screen='join';render()},
    goTV:()=>{S.joinTV=true;S.screen='join';render()},
    resume:()=>{const l=JSON.parse(ls.get('mafia_last')||'null');if(!l)return;if(!ready())return toast('انتظر ثواني لين يتصل');S.joinTV=l.mode==='tv';joinFlow(l.code)},
    rules:()=>{S.screen='rules';render()}, home:()=>{S.screen='home';render()},
    join:()=>joinFlow(document.getElementById('code').value.trim()),
    name:()=>joinPlayer(document.getElementById('name').value.trim()),
    leave:leaveRoom, reveal:()=>{S.revealed=true;render()}, hide:()=>{S.revealed=false;render()},
    act:()=>act(v), skipShot, vote:()=>castVote(v),
    adj:()=>H.adj(v).catch(onErr), distReset:()=>H.distReset().catch(onErr), pointsAdj:()=>{const [id,st]=v.split(':');const p=S.players.find(x=>x.id===id);if(!p)return;S.ptsDraft=S.ptsDraft||{};S.ptsDraft[id]=(S.ptsDraft[id]??(p.points||0))+Number(st);S.lastHtml=null;render();},
  pointsCancel:()=>{S.ptsDraft={};S.lastHtml=null;render();}, pointsSave:()=>H.saveAllPoints().catch(onErr), testMode:()=>{if(TEST_MODE){ls.del('mafia_last');location.href=location.pathname;}else{location.href=location.pathname+'?test=1';}}, storageOk:()=>{ls.set('mafia_storage_ok','1');render();}, wipe:async()=>{if(!confirm('تمسح كل بيانات اللعبة من هذا الجهاز؟ بتطلع من أي غرفة وتصير لاعب جديد'))return;try{localStorage.clear();sessionStorage.clear();}catch(e){}try{await auth.signOut();}catch(e){}location.href=location.pathname;},
    storeOk:()=>{ls.set('mafia_store_ok','1');render();}, ovTab:()=>{S.overTab=v;S.overTabAt=Date.now()+30000;S.lastHtml=null;render();scrollTo(0,0);}, overNext:()=>{S.overSeen=S.room?.gameNo||0;S.lastHtml=null;render();scrollTo(0,0);}, pickAv:()=>{const n=document.getElementById('name')?.value||'';S.avatar=v;S.lastHtml=null;render();const i=document.getElementById('name');if(i)i.value=n;}, resetProfile:()=>{if(confirm('تمسح سجلك؟')){saveProfile({games:0,wins:0,roles:{},titles:{},seen:[]});S.lastHtml=null;render();}}, goProfile:()=>{S.screen='profile';S.lastHtml=null;render();}, shareResult:()=>shareResult(), installApp:()=>installApp(), zoomCard:()=>{S.zoom=v;S.lastHtml=null;render();}, zoomClose:()=>{S.zoom=null;S.lastHtml=null;render();}, skipTalk:()=>{if(S.room?.status!=='morning'||!me()?.alive)return;col('players').doc(UID).update({talkReady:S.room.round}).catch(onErr);}, rejoinAsk:()=>rejoinAsk(v), rejoinCancel:()=>{clearInterval(S.rejoinTimer);col('rejoin').doc(UID).delete().catch(()=>{});S.rejoinSent=null;render();}, react:()=>sendReact(v), cancelLoad:()=>idle(), playerLeave:()=>playerLeave(), sound:()=>SFX.toggle(), narr:()=>NARR.toggle(), tutDone:()=>{ls.set('mafia_tut','1');render();}, transfer:()=>hostAction('transfer',v), shareRoom:()=>navigator.share&&navigator.share({title:'مافيا',text:'تعال العب مافيا معنا 🕵️',url:joinUrl(S.code)}).catch(()=>{}), kick:()=>hostAction('kick',v), h:()=>{const [n,arg]=String(v).split(':');return hostAction(n,arg);}, timer:()=>H.timer(v).catch(onErr), joinSelf:()=>hostAction('joinSelf'), leaveSelf:()=>hostAction('leaveSelf')
  }[b.dataset.a]||(()=>{}))();
});
document.addEventListener('visibilitychange',()=>{
  const vis=document.visibilityState==='visible';
  if(S.mode==='host'&&S.room&&isHost()&&S.code)roomRef(S.code).update({hostAway:!vis,hostBeat:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
  if(vis){wakeLock=null;keepAwake();tick();}
});
document.addEventListener('keydown',e=>{const rb=e.target.closest&&e.target.closest('[role=button]');if(rb&&(e.key==='Enter'||e.key===' ')){e.preventDefault();rb.click();return;}if(e.key!=='Enter')return;if(document.getElementById('hostName')){hostAction('joinSelf');return;}if(document.getElementById('code'))document.querySelector('[data-a=join]').click();else if(document.getElementById('name'))document.querySelector('[data-a=name]').click();});
render();

</script>
</body>
